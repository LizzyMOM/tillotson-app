<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one phone-width app column, navy header band, bottom tab bar; same look as the event app. */
:root {
  --bg: #EEF2F6; --surface: #FFFFFF; --sunk: #E2E8EE; --ink: #0D141B; --muted: #44515E; --line: #C9D2DB;
  --brand: #0B1B2B; --brand-ink: #FFFFFF; --brand-muted: #A9BCCF;
  --accent: #0074C8; --accent-ink: #FFFFFF; --accent-text: #0067B3; --accent-soft: #DCEBF8;
  --ok: #12733F; --ok-soft: #D9F2E3; --warn: #8A5300; --warn-soft: #FDEFD3; --danger: #B42318; --danger-soft: #FDE4E1;
  --f-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --live: #C62A1F;
  --r: 12px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #081019; --surface: #111C27; --sunk: #1A2734; --ink: #EAF0F5; --muted: #A3B2C0; --line: #2B3B4B;
  --brand: #050B12; --brand-ink: #FFFFFF; --brand-muted: #8EA3B8;
  --accent: #2B93E0; --accent-ink: #FFFFFF; --accent-text: #6BB8F0; --accent-soft: #12314B;
  --ok: #5FD08F; --ok-soft: #173627; --warn: #F2BC5C; --warn-soft: #3C2D12; --danger: #FF8A80; --danger-soft: #43201D;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #081019; --surface: #111C27; --sunk: #1A2734; --ink: #EAF0F5; --muted: #A3B2C0; --line: #2B3B4B;
  --brand: #050B12; --brand-ink: #FFFFFF; --brand-muted: #8EA3B8;
  --accent: #2B93E0; --accent-ink: #FFFFFF; --accent-text: #6BB8F0; --accent-soft: #12314B;
  --ok: #5FD08F; --ok-soft: #173627; --warn: #F2BC5C; --warn-soft: #3C2D12; --danger: #FF8A80; --danger-soft: #43201D;
  color-scheme: dark }

* { box-sizing: border-box }
html, body { height: 100% }
body { background: var(--bg); color: var(--ink); font: 500 16px/1.45 var(--f-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--brand) }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; margin: 0; line-height: 1.05; text-transform: uppercase; text-wrap: balance }
p { margin: 0 }
button, input, select { font: inherit; color: inherit }
a { color: var(--accent-text) }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px }

.app { max-width: 460px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; background: var(--bg); position: relative }
@media (min-width: 520px) { .app { border-inline: 1px solid var(--line); box-shadow: 0 0 40px rgba(0,0,0,.08) } }
.pad { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }

.top { background: var(--brand); color: var(--brand-ink); padding-block: 18px 20px; display: flex; flex-direction: column; gap: 6px; border-bottom: 4px solid var(--accent) }
.top .eyebrow { font: 700 12px var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--brand-muted) }
.top h1 { font-size: 34px }
.top .sub { color: var(--brand-muted); font-size: 15px }
.top .back { align-self: flex-start; background: none; border: 0; color: var(--brand-ink); font-weight: 700; padding: 6px 0; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; min-height: 40px }
.brandrow { display: flex; align-items: center; gap: 10px }
.mark { width: 38px; height: 38px; border-radius: 9px; background: var(--accent); display: grid; place-items: center; font: 800 21px var(--f-display); color: #fff; flex: none }

main { flex: 1; padding-block: 18px 150px; display: flex; flex-direction: column; gap: 16px }
.card { background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0 }
.card h2 { font-size: 22px }
.card h3 { font-size: 19px }
.label { font: 700 12px var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }
.muted { color: var(--muted) }
.small { font-size: 14px }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap }
.spread { display: flex; justify-content: space-between; gap: 10px; align-items: center }
.stack { display: flex; flex-direction: column; gap: 10px }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 20px; border-radius: 99px; border: 0; background: var(--accent); color: var(--accent-ink); font: 700 17px var(--f-body); cursor: pointer; text-decoration: none; text-align: center }
.btn.block { width: 100% }
.btn.ghost { background: var(--surface); color: var(--accent-text); border: 2px solid var(--line) }
.btn.small { min-height: 40px; font-size: 15px; padding: 0 14px }
.btn.live { background: var(--live); color: #fff }
.btn:disabled { opacity: .45; cursor: default }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent-text); font-weight: 700; cursor: pointer; text-decoration: underline; text-align: left }

.field { display: flex; flex-direction: column; gap: 5px }
.field label { font-weight: 700; font-size: 15px }
.field input, .field select { min-height: 50px; padding: 0 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); width: 100% }
.field .hint { font-size: 13px; color: var(--muted) }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.two > * { min-width: 0 }

.choice { display: flex; gap: 12px; align-items: flex-start; padding: 14px; border: 2px solid var(--line); border-radius: var(--r); background: var(--surface); cursor: pointer; text-align: left; width: 100% }
.choice.on { border-color: var(--accent); background: var(--accent-soft) }
.choice .tick { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); flex: none; display: grid; place-items: center; margin-top: 2px }
.choice.on .tick { background: var(--accent); border-color: var(--accent); color: #fff }
.choice .body { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1 }
.choice b { font-size: 17px }

.chip { display: inline-flex; align-items: center; gap: 6px; font: 700 12px/1.2 var(--f-body); text-transform: uppercase; letter-spacing: .05em; padding: 6px 9px; border-radius: 99px; background: var(--sunk); color: var(--muted) }
.chip.ok { background: var(--ok-soft); color: var(--ok) }
.chip.warn { background: var(--warn-soft); color: var(--warn) }
.chip.hot { background: var(--danger-soft); color: var(--danger) }
.chip.blue { background: var(--accent-soft); color: var(--accent-text) }

.steps { display: flex; gap: 6px }
.steps i { flex: 1; height: 5px; border-radius: 3px; background: color-mix(in srgb, var(--brand-ink) 22%, transparent) }
.steps i.on { background: var(--accent) }

.idcard { background: linear-gradient(135deg, #0B1B2B 0%, #0B2D4A 60%, #0074C8 140%); color: #fff; border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 14px; position: relative; overflow: hidden }
.idcard .num { font: 700 24px var(--f-display); letter-spacing: .06em }
.idcard .lbl { font: 700 11px var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: #A9BCCF }
.idcard .grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px }
.idcard .grid b { display: block; font-size: 15px }

.notice { display: grid; grid-template-columns: 36px minmax(0,1fr); gap: 12px; align-items: start; padding: 12px 0; border-top: 1px solid var(--line) }
.notice:first-of-type { border-top: 0; padding-top: 0 }
.notice .ic { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-text) }
.notice .ic.ok { background: var(--ok-soft); color: var(--ok) }
.notice .ic.warn { background: var(--warn-soft); color: var(--warn) }
.notice b { display: block }
.notice small { color: var(--muted); font-size: 13px }

/* calendar */
.month { display: flex; flex-direction: column; gap: 10px }
.month h2 { font-size: 24px; color: var(--accent-text); border-bottom: 3px solid var(--accent); padding-bottom: 4px }
.month.past h2 { color: var(--muted); border-bottom-color: var(--line) }
.entry { position: relative; display: grid; grid-template-columns: minmax(0,1fr); gap: 4px; background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--r); padding: 14px; border-left: 7px solid var(--accent) }
.entry.k-international { border-left-color: var(--brand) }
.entry.k-pre_season, .entry.k-other { border-left-color: var(--warn) }
.entry .when { display: flex; gap: 8px; align-items: baseline }
.entry .when b { font: 700 21px/1.05 var(--f-display); text-transform: uppercase }
.entry .when span { font: 600 14px var(--f-body); color: var(--muted) }
.entry .kicker { font: 700 12px var(--f-body); text-transform: uppercase; letter-spacing: .07em; color: var(--muted) }
.entry h3 { font-size: 22px }
.entry p { font-size: 15px; color: var(--muted) }
.venue { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 4px 10px 4px 6px; margin-left: -6px; border-radius: 99px; color: var(--accent-text); font: 700 17px var(--f-body); background: none; border: 0; cursor: pointer; text-align: left }
.venue:hover { background: var(--accent-soft); text-decoration: underline }
.tags { display: flex; gap: 6px; flex-wrap: wrap }
.entry.next { border-width: 2.5px; border-color: var(--accent); border-left-width: 7px; box-shadow: 0 4px 14px color-mix(in srgb, var(--accent) 22%, transparent); scroll-margin-top: 70px }
.flag { position: absolute; top: -11px; right: 12px; padding: 3px 10px; border-radius: 99px; background: var(--accent); color: var(--accent-ink); font: 700 12px var(--f-body); text-transform: uppercase; letter-spacing: .06em }
.entry.finished { grid-template-columns: minmax(0,1fr) auto; align-items: center; gap: 2px 10px; padding: 8px 12px; background: var(--sunk); border-color: var(--sunk); border-left: 7px solid var(--line); color: var(--muted) }
.entry.finished .when b { font-size: 16px; color: var(--muted) }
.entry.finished h3 { font-size: 17px; color: var(--muted) }
.entry.finished .venue { min-height: 0; padding: 0; margin: 0; font-size: 14px; font-weight: 600; color: var(--muted) }
.entry.finished .side { grid-column: 2; grid-row: 1 / span 3; display: flex; flex-direction: column; gap: 6px; align-items: flex-end }
.dot { width: 9px; height: 9px; border-radius: 50%; background: #fff; animation: pulse 1.2s ease-in-out infinite }
@keyframes pulse { 50% { opacity: .25 } }
@media (prefers-reduced-motion: reduce) { .dot { animation: none } }

/* track */
.mapcard { position: relative; border-radius: var(--r); overflow: hidden; border: 1.5px solid var(--line); background: var(--sunk); aspect-ratio: 16 / 10; max-width: 100% }
.mapcard svg { width: 100%; height: 100%; display: block }
.mapcard .coords { position: absolute; left: 10px; bottom: 10px; background: var(--surface); border-radius: 8px; padding: 5px 9px; font: 600 13px var(--f-body); font-variant-numeric: tabular-nums }

.list { display: flex; flex-direction: column }
.list .li { display: flex; justify-content: space-between; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); align-items: center }
.list .li:first-child { border-top: 0 }
.list .li > :first-child { min-width: 0 }
.money { font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap }
.total { font: 700 26px var(--f-display); font-variant-numeric: tabular-nums }

.status { display: flex; gap: 12px; align-items: center; padding: 14px; border-radius: var(--r) }
.status.ok { background: var(--ok-soft); color: var(--ok) }
.status.warn { background: var(--warn-soft); color: var(--warn) }
.status .big { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--surface) }
.status b { display: block; font-size: 18px }
.status small { color: var(--ink); opacity: .85; font-size: 14px }

.racenum { font: 800 64px/0.9 var(--f-display); color: var(--accent-text); font-variant-numeric: tabular-nums }
.pin { font: 700 28px var(--f-display); letter-spacing: .3em; font-variant-numeric: tabular-nums }

.licence { border-radius: 12px; overflow: hidden; border: 1.5px solid var(--line); max-width: 100% }
.licence svg { display: block; width: 100%; height: auto }
.docs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.doc { display: flex; flex-direction: column; gap: 6px; min-width: 0 }
.doc .cap { font-size: 13px; font-weight: 700; display: flex; gap: 6px; align-items: center }

.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; justify-content: center; pointer-events: none }
.tabs nav { pointer-events: auto; width: 100%; max-width: 460px; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); border-top: 1.5px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px) }
.tabs button { background: none; border: 0; min-height: 62px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font: 700 12px var(--f-body); color: var(--muted); cursor: pointer }
.tabs button.on { color: var(--accent-text) }
.tabs button.on svg { stroke: var(--accent-text) }
.tabs .badge { position: absolute; margin-left: 22px; margin-top: -26px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--danger); color: #fff; font-size: 11px; display: grid; place-items: center }

.testbtn { position: fixed; z-index: 6; right: max(14px, calc((100vw - 460px) / 2 + 14px), env(safe-area-inset-right, 0px)); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); min-height: 44px; padding: 0 14px; border-radius: 99px; border: 2px dashed var(--warn); background: var(--warn-soft); color: var(--warn); font: 700 14px var(--f-body); cursor: pointer; display: inline-flex; align-items: center; gap: 6px }
.scrim { position: fixed; inset: 0; z-index: 20; background: rgba(5,11,18,.55); display: flex; align-items: flex-end; justify-content: center }
.sheet { width: 100%; max-width: 460px; max-height: 88%; overflow: auto; background: var(--bg); border-radius: 18px 18px 0 0; padding-block: 18px calc(22px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px }
.sheet h2 { font-size: 26px }
.datechips { display: flex; flex-direction: column; gap: 8px }
.toast { position: fixed; z-index: 30; left: 50%; transform: translateX(-50%); bottom: calc(132px + env(safe-area-inset-bottom, 0px)); max-width: min(420px, calc(100vw - 32px)); background: var(--ink); color: var(--bg); padding: 12px 16px; border-radius: 12px; font-weight: 600; box-shadow: 0 6px 24px rgba(0,0,0,.25) }
.testnote { font-size: 13px; color: var(--warn); background: var(--warn-soft); border-radius: 10px; padding: 8px 12px }
.qty { display: inline-flex; align-items: center; gap: 8px }
.qty button { width: 40px; height: 40px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); font-weight: 800; font-size: 20px; cursor: pointer }
.qty span { min-width: 18px; text-align: center; font-weight: 800; font-variant-numeric: tabular-nums }
.kv { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 6px 14px; font-size: 15px }
.kv dt { color: var(--muted); font-weight: 600 }
.kv dd { margin: 0; font-weight: 700; overflow-wrap: anywhere }
</style>

<div class="app" id="app"></div>

function quote() {
  const r = S.reg, t = EVENT.tickets[r.ticket], lines = [{ l: `${t.name} entry`, c: t.price }];
  for (const c of EVENT.clothing) if (r.extra[c.id]) lines.push({ l: `${c.name} × ${r.extra[c.id]}`, c: c.price * r.extra[c.id] });
  const sets = Math.min(r.extra.tee, r.extra.polo, r.extra.hoody);
  if (sets) lines.push({ l: `T-shirt, polo and hoody bundle (20% off × ${sets})`, c: -Math.round(sets * (2500 + 3500 + 4500) * 0.2) });
  if (r.toolkit) lines.push({ l: "Tillotson Toolkit rental (non-refundable)", c: EVENT.toolkit });
  lines.push({ l: "Breakage deposit (refundable)", c: EVENT.deposit });
  return { lines, total: lines.reduce((a, b) => a + b.c, 0) };
}

}

function tabCalendar() {
  const list = onCal(S.region);
  const nx = list.find((e) => state(e) !== "done");
  const finished = list.filter((e) => state(e) === "done").length;
  const months = new Map();
  for (const e of list) months.set(mon(e.s), [...(months.get(mon(e.s)) || []), e]);
  const home = ["UK", "Northern Ireland"].includes(S.region) ? "United Kingdom" : S.region;
  const title = (e) => e.t;
  return `
    ${header({ eyebrow: "Calendar", title: `${CAL_TITLE[S.region] || S.region + " calendar"} 2027`, sub: `${finished ? `${finished} of ${list.length} events finished` : `${list.length} events`} · tap a track for directions` })}
    <main class="pad">
      ${nx && finished ? `<button class="btn small" data-act="jump" style="align-self:flex-start">${state(nx) === "live" ? "On now" : "Next up"}: ${esc(nx.t)} ↓</button>` : ""}
      ${[...months].map(([m, es]) => `<section class="month${es.every((e) => state(e) === "done") ? " past" : ""}"><h2>${m}</h2>
        ${es.map((e) => {
          const st = state(e), v = VENUES[e.v];
          if (st === "done") return `<article class="entry finished">
            <div class="when"><b>${range(e.s, e.e)}</b></div><h3>${esc(title(e))}</h3>
            <button class="venue" data-act="track:${e.v}">${esc(v.name)}</button>
            <div class="side">${e.results ? `<button class="btn small" data-act="toast:In the live app this opens the results page the organiser added.">Results</button>` : ""}${e.photos ? `<button class="btn small ghost" data-act="toast:In the live app this opens the photo album.">Photos</button>` : ""}${!e.results && !e.photos ? `<span class="chip">Finished</span>` : ""}</div>
          </article>`;
          const isNext = e === nx, global = e.r.includes("Global");
          return `<article class="entry k-${e.k}${isNext ? " next" : ""}"${isNext ? ' id="next"' : ""}>
            ${isNext ? `<div class="flag">${st === "live" ? "On now" : "Next up"}</div>` : ""}
            <div class="when"><b>${range(e.s, e.e)}</b><span>${days(e.s, e.e)}</span></div>
            <div class="kicker">${global ? "Tillotson T4 Global Events" : KIND[e.k]}</div>
            <h3>${esc(title(e))}</h3>
            <button class="venue" data-act="track:${e.v}">${ic("pin", 18)} ${esc(v.name)}${v.country !== home && v.country !== S.region ? `, ${esc(v.country)}` : ""}</button>
            ${st === "live" && e.live ? `<button class="btn live small" style="align-self:flex-start" data-act="toast:In the live app this opens the timing page the organiser added."><span class="dot"></span> Live timing</button>` : ""}
            ${e.d ? `<p>${esc(e.d)}</p>` : ""}
            ${e.event ? `<button class="btn small" style="align-self:flex-start" data-act="tab:events">${S.reg.paid ? "My entry" : "Enter this event"}</button>` : ""}
            <div class="tags">${(e.tags || []).map((t) => `<span class="chip hot">${esc(t)}</span>`).join("")}${global ? `<span class="chip blue">On every country's calendar</span>` : ""}${!global && e.r.length > 1 ? `<span class="chip blue">Also on ${e.r.filter((r) => r !== S.region).map((r) => CAL_TITLE[r] || r).join(" & ")} calendars</span>` : ""}</div>
          </article>`;
        }).join("")}</section>`).join("")}
    </main>`;
}

function trackView(slug) {
  const v = VENUES[slug];
  const upcoming = CAL.filter((e) => e.v === slug && e.e >= S.today).sort((a, b) => a.s.localeCompare(b.s));
  const dir = `https://www.google.com/maps/dir/?api=1&destination=${v.lat},${v.lng}`;
  const sat = `https://www.google.com/maps/@${v.lat},${v.lng},500m/data=!3m1!1e3`;
  const osm = `https://www.openstreetmap.org/?mlat=${v.lat}&mlon=${v.lng}#map=16/${v.lat}/${v.lng}`;
  return `
    ${header({ back: "close", eyebrow: "Track", title: esc(v.name), sub: v.full !== v.name ? esc(v.full) : "" })}
    <main class="pad">
      ${mapArt(v)}
      ${v.approx ? `<p class="small muted">The pin is near the track, not on it. Check the entrance on arrival.</p>` : ""}
      <div class="card">
        <div class="label">Address</div><p>${esc(v.address)}<br>${esc(v.country)}</p>
        <div class="two"><a class="btn" href="${dir}" target="_blank" rel="noopener">Directions</a><a class="btn ghost" href="${sat}" target="_blank" rel="noopener">Satellite view</a></div>
        <a class="small" href="${osm}" target="_blank" rel="noopener">Open the track map on OpenStreetMap</a>
      </div>
      <div class="card"><h2>Coming up here</h2>
        ${upcoming.length ? `<div class="list">${upcoming.map((e) => `<div class="li"><b>${range(e.s, e.e)}</b><span class="small" style="text-align:right">${esc(e.t)}</span></div>`).join("")}</div>` : `<p class="muted">Nothing else on the calendar here this year.</p>`}

    </main>`;
}

    ${r.ticket === "opt2" ? `<p class="small muted">Suggested because ${esc(m.first)} owns a T4 kart (${esc(S.kart.chassis)}).</p>` : ""}

    </div>
    <button class="choice ${r.toolkit ? "on" : ""}" data-act="reg:toolkit"><span class="tick">${r.toolkit ? ic("check", 16, 3) : ""}</span><span class="body"><span class="spread"><b>Rent a Tillotson Toolkit</b><span class="money">${eur(EVENT.toolkit)}</span></span><span class="small muted">Everything needed to work on a T4 kart, in a Senzo toolbox. Non-refundable.</span></span></button>`;

/* ------------------------------------------------------------------ render */
function render() {
  const app = $("#app");
  if (S.stage !== "app") { app.innerHTML = SCREENS[S.stage](); $("#layer").innerHTML = ""; window.scrollTo(0, 0); return; }
  let html;
  if (S.view?.type === "track") html = trackView(S.view.slug);
  else if (S.view?.type === "reg") html = regView();
  else html = { home: tabHome, calendar: tabCalendar, events: tabEvents, kart: tabKart, profile: tabProfile }[S.tab]();
  const tabs = [["home", "Home", "home"], ["calendar", "Calendar", "cal"], ["events", "Events", "flag"], ["kart", "My kart", "kart"], ["profile", "Profile", "user"]];
  app.innerHTML = html + `<div class="tabs"><nav aria-label="Main">${tabs.map(([k, l, i]) => `<button class="${S.tab === k && !S.view ? "on" : ""}" data-act="tab:${k}"${S.tab === k && !S.view ? ' aria-current="page"' : ""}>${ic(i, 24)}${l}${k === "home" && S.read < notices().length ? `<span class="badge">${notices().length - S.read}</span>` : ""}</button>`).join("")}</nav></div>
    <button class="testbtn" data-act="sheet:open">${ic("wrench", 18)} Test controls</button>`;
}
function draw(scroll = "top") {
  if (S.stage === "app" && S.tab === "home" && !S.view) S.read = notices().length;
  save(); render();
  if (scroll === "top") window.scrollTo(0, 0);
  if (scroll === "next") { const n = document.getElementById("next"); if (n) n.scrollIntoView({ block: "start" }); else window.scrollTo(0, 0); }
}

document.addEventListener("input", (ev) => {
  const b = ev.target.dataset?.bind; if (!b) return;
  const path = b.split("."); let o = S; while (path.length > 1) o = o[path.shift()]; o[path[0]] = ev.target.value; save();
  if (b === "region") { render(); }
});
document.addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-act]"); if (!el || el.disabled) return;
  if (el.classList.contains("scrim") && ev.target.closest("[data-stop]")) return;
  const [a, ...rest] = el.dataset.act.split(":"); const arg = rest.join(":");
  switch (a) {
    case "go": S.stage = arg; draw(); break;
    case "toast": toast(arg); break;
    case "kart": S.kart.how = arg; draw("none"); break;
    case "finish": S.stage = "app"; S.tab = "home"; S.view = null; draw(); toast("Tillotson ID created"); break;
    case "tab": S.tab = arg; S.view = null; draw(arg === "calendar" ? "next" : "top"); break;
    case "track": S.view = { type: "track", slug: arg }; draw(); break;
    case "close": S.view = null; draw(S.tab === "calendar" ? "next" : "top"); break;
    case "jump": document.getElementById("next")?.scrollIntoView({ block: "start", behavior: "smooth" }); break;
    case "reg": {
      const [sub, x, y] = arg.split(":");
      if (sub === "start") { S.view = { type: "reg" }; S.regStep = 0; S.reg.ticket = "opt2"; }
      if (sub === "back") S.regStep = Math.max(0, S.regStep - 1);
      if (sub === "next") S.regStep = Math.min(4, S.regStep + 1);
      if (sub === "letter") { S.reg.letter = !S.reg.letter; draw("none"); return; }
      if (sub === "ticket") { S.reg.ticket = x; draw("none"); return; }
      if (sub === "toolkit") { S.reg.toolkit = !S.reg.toolkit; draw("none"); return; }
      if (sub === "terms") { S.reg.terms = !S.reg.terms; draw("none"); return; }
      if (sub === "qty") { S.reg.extra[x] = Math.max(0, Math.min(10, S.reg.extra[x] + Number(y))); draw("none"); return; }
      if (sub === "pay") {
        // T4 Senior168 numbers start at 510, in order of payment; Mark is the first to pay in this test.
        S.reg.paid = true; S.reg.number = 510; S.reg.pin = String(100000 + Math.floor(Math.random() * 900000));
        S.view = null; S.tab = "events"; draw(); toast(`Paid. Race number ${S.reg.number}. PIN sent to ${S.acct.email}`); return;
      }
      draw(); break;
    }
    case "sheet": if (arg === "open") $("#layer").innerHTML = testSheet(); else $("#layer").innerHTML = ""; break;
    case "date": S.today = arg; $("#layer").innerHTML = testSheet(); draw(S.tab === "calendar" && !S.view ? "next" : "none"); break;
    case "t": {
      if (arg === "kart") S.kart.status = S.kart.status === "confirmed" ? "pending" : "confirmed";
      if (arg === "approve") S.approved = !S.approved;
      if (arg === "kit") S.kitCollected = !S.kitCollected;
      if (arg === "reset") { S = START(); $("#layer").innerHTML = ""; draw(); return; }
      $("#layer").innerHTML = testSheet(); draw("none"); break;
    }
  }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") $("#layer").innerHTML = ""; });
render();
</script>
